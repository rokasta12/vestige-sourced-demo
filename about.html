<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VESTIGE — About Coming Soon</title>
  <meta name="description" content="VESTIGE coming soon landing page with white studio background and product reveal animation." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Archivo+Black&family=Anton&family=Bebas+Neue&family=Bungee&family=Changa+One:ital@0;1&family=Dela+Gothic+One&family=DM+Serif+Display&family=Inter:wght@400;500;600;700;900&family=League+Gothic&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@700;800;900&family=Shrikhand&family=Ultra&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css" />
  <style>
    :root {
      --wvr-brand-color: #b7a65e;
      --vestige-brand-font: 'Dela Gothic One', 'Arial Black', sans-serif;
      --page-x: clamp(18px, 4vw, 56px);
      --header-h: 104px;
      --focus: #050505;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100%; background: #fff; color: #050505; font-family: Inter, system-ui, sans-serif; overflow-x: hidden; }
    a, button { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .skip-link { position: fixed; left: 12px; top: 12px; z-index: 100; transform: translateY(-140%); background: #050505; color: #fff; padding: 12px 14px; border-radius: 999px; font-weight: 900; text-decoration: none; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
    .skip-link:focus { transform: translateY(0); }
    .cs-header { position: fixed; inset: 0 0 auto; z-index: 20; min-height: var(--header-h); display: grid; grid-template-columns: minmax(70px,1fr) auto minmax(70px,1fr); align-items: center; gap: 12px; padding: 0 var(--page-x); background: rgba(255,255,255,.84); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,0,0,.06); }
    .cs-menu, .cs-status { font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #050505; text-decoration: none; }
    .cs-status { justify-self: end; color: #6f6f6f; text-align: right; }
    .cs-logo { font-family: var(--vestige-brand-font); color: var(--wvr-brand-color); font-size: clamp(26px, 5vw, 50px); line-height: .9; letter-spacing: -.03em; text-transform: uppercase; text-align: center; }
    .cs-hero { position: relative; min-height: 100svh; padding: calc(var(--header-h) + 24px) var(--page-x) 32px; overflow: hidden; isolation: isolate; display: grid; place-items: center; background: #fff; }
    .cs-reveal { position: absolute; inset: var(--header-h) 0 0; z-index: 1; display: flex; align-items: center; width: max-content; gap: clamp(42px, 8vw, 140px); animation: vestige-coming-slide 24s linear infinite; opacity: .96; }
    .cs-reveal img { width: clamp(120px, 22vw, 330px); max-height: 50svh; object-fit: contain; background: #fff; mix-blend-mode: multiply; }
    .cs-reveal img:nth-child(2n) { width: clamp(95px, 16vw, 250px); transform: translateY(34px); }
    .cs-reveal img:nth-child(3n) { width: clamp(150px, 27vw, 420px); transform: translateY(-18px); }
    @keyframes vestige-coming-slide { from { transform: translateX(8vw); } to { transform: translateX(-50%); } }
    .cs-center { position: relative; z-index: 4; width: min(980px, 100%); margin: 0 auto; text-align: center; display: grid; place-items: center; gap: clamp(16px, 3vw, 26px); }
    .cs-kicker { margin: 0; color: #666; font-size: 11px; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    .cs-brand { margin: 0; font-family: var(--vestige-brand-font); font-size: clamp(4.1rem, 17vw, 13rem); line-height: .78; letter-spacing: -.055em; text-transform: uppercase; color: var(--wvr-brand-color); text-wrap: balance; }
    .cs-coming { margin: 0; font-family: 'Archivo', Inter, sans-serif; font-size: clamp(1.8rem, 6vw, 5.5rem); font-weight: 900; line-height: .9; letter-spacing: -.035em; text-transform: uppercase; color: #050505; text-wrap: balance; }
    .cs-copy { max-width: 590px; margin: 0; color: #333; font-size: clamp(15px, 1.8vw, 18px); font-weight: 600; line-height: 1.5; }
    .cs-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; }
    .cs-actions a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #050505; border-radius: 999px; padding: 14px 20px; text-decoration: none; font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #050505; background: rgba(255,255,255,.88); backdrop-filter: blur(10px); }
    .cs-actions a:first-child { background: #050505; color: #fff; }
    .cs-actions a:hover { background: var(--wvr-brand-color); color: #050505; border-color: var(--wvr-brand-color); }
    .cs-preview { position: relative; z-index: 5; width: min(880px, 100%); margin: clamp(24px, 6vw, 60px) auto 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(8px, 2vw, 18px); }
    .cs-preview img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; mix-blend-mode: multiply; border: 1px solid #f1f1f1; border-radius: 18px; padding: 6px; }
    .cs-bottom-note { position: absolute; left: var(--page-x); right: var(--page-x); bottom: 24px; z-index: 5; display: flex; justify-content: space-between; gap: 16px; font-size: 10px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: #777; pointer-events: none; }
    .view-split .cs-center { text-align: left; place-items: start; margin-left: 0; width: min(620px, 100%); }
    .view-split .cs-hero { place-items: center start; }
    .view-split .cs-preview { position: absolute; right: var(--page-x); bottom: clamp(70px, 10vw, 120px); width: min(44vw, 520px); grid-template-columns: repeat(3, 1fr); }
    .view-editorial .cs-brand { color: #050505; }
    .view-editorial .cs-coming { color: var(--wvr-brand-color); }
    .view-editorial .cs-reveal { opacity: .54; }
    .view-minimal .cs-reveal { opacity: .32; }
    .view-minimal .cs-preview { display: none; }
    @media (max-width: 820px) {
      :root { --header-h: 88px; }
      .cs-header { grid-template-columns: 1fr auto 1fr; }
      .cs-status { display: none; }
      .cs-menu { font-size: 10px; }
      .cs-hero { min-height: 100svh; padding-top: calc(var(--header-h) + 28px); padding-bottom: 28px; }
      .cs-reveal { animation-duration: 18s; gap: 42px; opacity: .9; }
      .cs-brand { font-size: clamp(4.0rem, 20vw, 7.8rem); }
      .cs-copy { max-width: 38ch; }
      .cs-actions { width: 100%; }
      .cs-actions a { flex: 1 1 160px; }
      .cs-preview, .view-split .cs-preview { position: relative; right: auto; bottom: auto; width: 100%; grid-template-columns: repeat(3, 1fr); margin-top: 26px; }
      .view-split .cs-center { text-align: center; place-items: center; margin: 0 auto; }
      .view-split .cs-hero { place-items: center; }
      .cs-bottom-note { position: relative; inset: auto; padding: 0; margin-top: 24px; flex-direction: column; text-align: center; align-items: center; }
    }
    @media (max-width: 430px) {
      .cs-header { padding-inline: 14px; }
      .cs-logo { font-size: 25px; }
      .cs-brand { font-size: clamp(3.45rem, 20vw, 5.2rem); letter-spacing: -.06em; }
      .cs-coming { font-size: clamp(1.55rem, 9vw, 2.6rem); }
      .cs-preview, .view-split .cs-preview { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .cs-reveal { animation: none; transform: translateX(-8vw); }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
</style>
</head>
